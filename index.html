<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warung CT - Pesan Online</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ct: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            900: '#134e4a',
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .loader { border: 2px solid #f3f3f3; border-radius: 50%; border-top: 2px solid #0d9488; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #qrModal { transition: all 0.2s ease-out; opacity: 0; pointer-events: none; visibility: hidden; z-index: 100; }
        #qrModal.active { opacity: 1; pointer-events: auto; visibility: visible; }
        #qrcode { background: white; padding: 12px; border-radius: 8px; }
        #qrcode img { display: block !important; margin: 0 auto; }
    </style>
</head>
<body class="text-slate-800 antialiased pb-48">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl relative">
        
        <!-- Header - Tombol QR dipindah ke sini (Pojok Kanan Atas) -->
        <header class="bg-ct-600 text-white p-8 rounded-b-[3rem] shadow-lg relative overflow-hidden text-center">
            <div class="relative z-10">
                <h1 class="text-3xl font-black italic tracking-tighter uppercase">WARUNG CT</h1>
                <p class="text-ct-100 text-xs font-medium tracking-[0.2em] mt-1 uppercase">The Real Temenan</p>
            </div>
            
            <!-- Tombol QR Baru di Header -->
            <button onclick="toggleQRModal(true)" class="absolute top-6 right-6 w-12 h-12 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center text-xl border border-white/30 z-20 active:scale-90 transition-all">
                <span>📱</span>
            </button>

            <div class="absolute -right-10 -top-10 w-40 h-40 bg-ct-500 rounded-full opacity-50"></div>
        </header>

        <main class="px-6 py-8 space-y-8">
            <!-- Bagian Form Nama & GPS -->
            <section class="space-y-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-ct-100 text-ct-700 flex items-center justify-center font-black text-sm">1</div>
                    <h2 class="font-bold text-lg">Info Pengiriman</h2>
                </div>
                <div class="space-y-3">
                    <input type="text" id="userName" placeholder="Atas Nama..." class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-ct-500 outline-none transition-all">
                    <button id="btnLocation" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition-all flex justify-center items-center gap-3">
                        <span>📍 Klik: Hitung Ongkir Otomatis</span>
                    </button>
                    <div id="locationStatus" class="hidden text-center py-3 text-xs font-bold rounded-xl bg-ct-50 text-ct-700 border border-ct-100"></div>
                </div>
            </section>

            <!-- Bagian Menu -->
            <section class="space-y-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-ct-100 text-ct-700 flex items-center justify-center font-black text-sm">2</div>
                    <h2 class="font-bold text-lg">Pilih Menu</h2>
                </div>
                <div id="menuUtama" class="space-y-2"></div>
                <div id="menuTambahan" class="space-y-2 pt-4 border-t border-slate-100"></div>
            </section>

            <!-- Info Ongkir -->
            <section class="bg-slate-50 p-6 rounded-[2rem] border border-slate-100">
                <h3 class="font-bold text-slate-400 mb-4 text-[10px] uppercase tracking-widest text-center">Estimasi Biaya Kirim</h3>
                <div class="h-32">
                    <canvas id="ongkirChart"></canvas>
                </div>
                <p class="text-[9px] text-slate-400 mt-4 text-center">1km Rp 2rb, selanjutnya +Rp 1rb/km</p>
            </section>
        </main>

        <!-- Modal QR -->
        <div id="qrModal" class="fixed inset-0 flex items-center justify-center p-6 bg-slate-900/80 backdrop-blur-sm">
            <div class="bg-white w-full max-w-xs rounded-[2.5rem] overflow-hidden shadow-2xl">
                <div class="bg-ct-600 p-6 text-center text-white">
                    <h3 class="font-black italic uppercase">Share Warung CT</h3>
                    <button onclick="toggleQRModal(false)" class="absolute top-4 right-4 text-white/50">✕</button>
                </div>
                <div class="p-8 text-center space-y-6">
                    <div class="flex justify-center" id="qrcode"></div>
                    <button onclick="copyLink()" class="w-full py-4 bg-ct-50 text-ct-700 rounded-2xl font-bold text-sm">Salin Link</button>
                </div>
            </div>
        </div>

        <!-- Checkout Bar (Sticky Bottom) -->
        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 backdrop-blur-md border-t border-slate-100 p-6 z-40 rounded-t-[2.5rem] shadow-2xl">
            <div class="flex justify-between items-end mb-4 px-2">
                <div>
                    <p id="distText" class="text-[10px] font-bold text-slate-400 uppercase">Jarak: 0 km</p>
                    <p class="text-2xl font-black text-slate-900">Rp <span id="grandTotal">0</span></p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] font-bold text-ct-600 uppercase">Ongkir: Rp <span id="ongkirVal">0</span></p>
                    <p id="countVal" class="text-xs text-slate-500">0 Item</p>
                </div>
            </div>
            <button id="btnPesan" class="w-full bg-ct-600 hover:bg-ct-700 disabled:bg-slate-200 disabled:text-slate-400 text-white py-5 rounded-2xl font-black text-lg transition-all active:scale-95" disabled>
                ORDER VIA WHATSAPP
            </button>
        </div>
    </div>

    <script>
        const state = {
            user: { name: '' },
            order: { distanceKm: 0, shippingCost: 0, grandTotal: 0 },
            cart: {},
            warungLoc: { lat: -7.166875, lon: 112.326875 }
        };

        const menuUtama = [
            { id: 'u1', name: 'Ayam Goreng', price: 10000, icon: '🍗' },
            { id: 'u2', name: 'Pecel Lele', price: 10000, icon: '🐟' },
            { id: 'u3', name: 'Dadar', price: 7000, icon: '🍳' },
            { id: 'u4', name: 'Ati Ampela', price: 8000, icon: '🍢' },
            { id: 'u5', name: 'Tempe Penyet', price: 6000, icon: '🍱' },
            { id: 'u6', name: 'Nasgor Ori', price: 10000, icon: '🍚' },
            { id: 'u7', name: 'Nasgor + Sosis', price: 13000, icon: '🌭' },
            { id: 'u8', name: 'Nasgor + Dadar', price: 13000, icon: '🥘' }
        ];

        const menuTambahan = [
            { id: 't1', name: 'Telur', price: 3000 },
            { id: 't2', name: 'Kepala', price: 3000 },
            { id: 't3', name: 'Ati Ampela', price: 5000 },
            { id: 't4', name: 'Sambal', price: 3000 },
            { id: 't5', name: 'Nasi Hidup', price: 3000 }
        ];

        function init() {
            render('menuUtama', menuUtama, 'text-ct-600');
            render('menuTambahan', menuTambahan, 'text-orange-600', 'MENU TAMBAHAN');
            initChart();
            new QRCode(document.getElementById("qrcode"), { text: window.location.href, width: 180, height: 180 });
            bind();
        }

        function render(id, data, color, title) {
            let h = title ? `<p class="text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-widest">${title}</p>` : '';
            h += data.map(m => `
                <div class="bg-slate-50 p-4 rounded-2xl flex justify-between items-center border border-slate-100">
                    <div class="flex items-center gap-3">
                        ${m.icon ? `<span class="text-xl">${m.icon}</span>` : ''}
                        <div>
                            <p class="font-bold text-sm">${m.name}</p>
                            <p class="${color} font-black text-xs">Rp ${m.price.toLocaleString('id-ID')}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 bg-white px-2 py-1 rounded-xl shadow-sm border">
                        <button onclick="upd('${m.id}', -1)" class="w-8 h-8 text-slate-300">-</button>
                        <span id="qty-${m.id}" class="w-4 text-center font-bold text-xs">0</span>
                        <button onclick="upd('${m.id}', 1)" class="w-8 h-8 font-bold ${color}">+</button>
                    </div>
                </div>
            `).join('');
            document.getElementById(id).innerHTML = h;
        }

        window.upd = (id, c) => {
            state.cart[id] = Math.max(0, (state.cart[id] || 0) + c);
            document.getElementById(`qty-${id}`).innerText = state.cart[id];
            calc();
        };

        function calc() {
            let total = 0, count = 0;
            [...menuUtama, ...menuTambahan].forEach(m => {
                const q = state.cart[m.id] || 0;
                total += q * m.price;
                count += q;
            });
            state.order.grandTotal = total + (count > 0 ? state.order.shippingCost : 0);
            document.getElementById('countVal').innerText = `${count} Item`;
            document.getElementById('grandTotal').innerText = state.order.grandTotal.toLocaleString('id-ID');
            document.getElementById('btnPesan').disabled = !(state.user.name.length > 1 && count > 0 && state.order.distanceKm > 0);
        }

        function getD(la1, lo1, la2, lo2) {
            const R = 6371;
            const dLa = (la2-la1)*Math.PI/180, dLo = (lo2-lo1)*Math.PI/180;
            const a = Math.sin(dLa/2)**2 + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function loc() {
            const b = document.getElementById('btnLocation');
            b.innerHTML = '<span class="loader"></span> Mencari...';
            navigator.geolocation.getCurrentPosition(p => {
                const d = getD(state.warungLoc.lat, state.warungLoc.lon, p.coords.latitude, p.coords.longitude);
                state.order.distanceKm = parseFloat(d.toFixed(1));
                state.order.shippingCost = (state.order.distanceKm <= 1) ? 2000 : 2000 + (Math.ceil(state.order.distanceKm - 1) * 1000);
                document.getElementById('distText').innerText = `Jarak: ${state.order.distanceKm} km`;
                document.getElementById('ongkirVal').innerText = state.order.shippingCost.toLocaleString('id-ID');
                b.innerHTML = '✅ Lokasi OK';
                b.classList.replace('bg-slate-900', 'bg-ct-600');
                document.getElementById('locationStatus').classList.remove('hidden');
                document.getElementById('locationStatus').innerText = `Jarak Anda: ${state.order.distanceKm} km`;
                calc();
            }, () => alert('Gagal ambil lokasi! Nyalakan GPS dulu bro.'));
        }

        window.toggleQRModal = s => document.getElementById('qrModal').classList.toggle('active', s);
        window.copyLink = () => {
            const t = document.createElement("input"); t.value = window.location.href;
            document.body.appendChild(t); t.select(); document.execCommand("copy");
            document.body.removeChild(t); alert("Link disalin!");
        };

        function bind() {
            document.getElementById('userName').addEventListener('input', e => { state.user.name = e.target.value; calc(); });
            document.getElementById('btnLocation').addEventListener('click', loc);
            document.getElementById('btnPesan').addEventListener('click', () => {
                let m = `*ORDER WARUNG CT*\nNama: ${state.user.name}\nJarak: ${state.order.distanceKm}km\n\n*Pesanan:*\n`;
                [...menuUtama, ...menuTambahan].forEach(i => { if(state.cart[i.id]) m += `- ${i.name} (${state.cart[i.id]}x)\n`; });
                m += `\n*Total: Rp ${state.order.grandTotal.toLocaleString('id-ID')}*`;
                window.open(`https://wa.me/6285730030112?text=${encodeURIComponent(m)}`);
            });
        }

        function initChart() {
            new Chart(document.getElementById('ongkirChart'), {
                type: 'line',
                data: { labels: ['1k', '2k', '4k', '6k', '10k'], datasets: [{ data: [2000, 3000, 5000, 7000, 11000], borderColor: '#0d9488', fill: false, tension: 0.3 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } }
            });
        }
        init();
    </script>
</body>
</html>
